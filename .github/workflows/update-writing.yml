name: Update Let Data Speak

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/royal-beige-green-redesign
    paths:
      - ".github/workflows/update-writing.yml"
      - "scripts/update-writing.mjs"
      - "index.html"
  schedule:
    - cron: "17 3,15 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh publication archive
        run: node scripts/update-writing.mjs
      - name: Validate updater
        run: node --test scripts/update-writing.test.mjs
      - name: Commit when a new issue exists
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Let Data Speak"
          git push
